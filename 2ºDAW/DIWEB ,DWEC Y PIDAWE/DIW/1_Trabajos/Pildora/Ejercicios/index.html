<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Multimedia en HTML5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Gestión Multimedia en HTML5</h1>

<!-- ===================== AUDIOS ===================== -->
<div class="media-container">
    <h2>🎵 Audios HTML5</h2>

    <!-- Audio normal -->
    <audio controls preload="none">
        <source src="sonido/audio.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio avanzado -->
    <audio id="audio2" preload="metadata">
        <source src="sonido/audio1.mp3" type="audio/mpeg">
    </audio>

    <div class="controls">
        <button id="audioPlay">▶️</button>

        <label>Velocidad
            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </label>

       <button id="loopBtn">🔁 Loop OFF</button>

        <div class="time">
            <span id="audioCurrent">0:00</span> /
            <span id="audioDuration">0:00</span>
        </div>

        <div class="progress" id="audioProgress">
            <div class="progress-bar" id="audioProgressBar"></div>
        </div>
    </div>
</div>

<!-- ===================== VIDEOS ===================== -->
<div class="media-container row">

    <!-- Video normal -->
    <div class="col">
        <h2>🎥 Vídeo sin modificar</h2>
        <video controls>
            <source src="sonido/video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Video avanzado -->
    <div class="col">
        <h2>🎬 Vídeo personalizado</h2>

        <video id="video" preload="metadata">
            <source src="sonido/video1.mp4" type="video/mp4">
        </video>

        <div class="controls">
            <button id="play">▶️</button>
            <button id="mute">🔇</button>
            <button id="pip">🖼️</button>
            <button id="fullscreen">⛶</button>

            <div class="time">
                <span id="current">0:00</span> /
                <span id="duration">0:00</span>
            </div>

            <div class="progress" id="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <label>Volumen
                <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
            </label>
        </div>
    </div>
</div>

<!-- ===================== IMÁGENES ===================== -->
<div class="media-container row">

    <div class="col">
        <h2>🖼️ Imagen normal</h2>
        <img src="sonido/imagen.jpg">
    </div>

    <div class="col">
        <h2>🖌️ Imagen editable</h2>

        <div class="img-wrapper">
            <img id="editable-img" src="sonido/imagen1.jpg">
        </div>

        <div class="controls">
            <button id="zoom">🔍</button>
            <button id="opacity">🌫️</button>
            <button id="rotate">🔄</button>
            <button id="reset">♻️</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
