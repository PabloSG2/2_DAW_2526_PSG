<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Multimedia en HTML5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Gestión Multimedia en HTML5</h1>

<!-- ===================== AUDIO ===================== -->
<div class="media-container">
    <h2>🎵 Audio HTML5</h2>
    <audio controls preload="none">
        <source src="sonido/audio.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
    </audio>
</div>

<!-- ===================== VIDEOS LADO A LADO ===================== -->
<div class="media-container row">
    
    <!-- Video sin modificar -->
    <div class="col">
        <h2>🎥 Vídeo sin modificar</h2>
        <video controls width="100%">
            <source src="sonido/video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Video con controles personalizados -->
    <div class="col">
        <h2>🎬 Vídeo con controles personalizados</h2>

        <video id="video" preload="metadata">
            <source src="sonido/video.mp4" type="video/mp4">
        </video>

        <div class="controls">
            <button id="play">▶️ Play / Pause</button>
            <button id="pip">🖼️ Picture-in-Picture</button>

            <div class="progress" id="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

</div>

<!-- ===================== IMÁGENES LADO A LADO ===================== -->
<div class="media-container row">

    <!-- Imagen sin modificar -->
    <div class="col">
        <h2>🖼️ Imagen sin modificar</h2>
        <img src="sonido/imagen.jpg" class="static-img">
    </div>

    <!-- Imagen modificable -->
    <div class="col">
        <h2>🖌️ Imagen modificable</h2>

        <!-- CONTENEDOR QUE EVITA QUE EL ZOOM TAPE OTROS ELEMENTOS -->
        <div class="img-wrapper">
            <img id="editable-img" src="sonido/imagen1.jpg">
        </div>

        <div class="controls">
            <button id="zoom">🔍 Zoom</button>
            <button id="opacity">🌫️ Opacidad</button>
            <button id="reset">♻️ Reset</button>
        </div>
    </div>

</div>

<script src="main.js"></script>
</body>
</html>
