<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Multimedia en HTML5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Gestión Multimedia en HTML5</h1>

<!-- ===================== AUDIOS ===================== -->
<div class="media-container">
    <h2>🎵 Audios HTML5 (Normal + Avanzado)</h2>

    <!-- Audio normal -->
    <div class="audio-box">
        <h3>Audio HTML5</h3>
        <audio controls preload="none">
            <source src="sonido/audio.mp3" type="audio/mpeg">
            Tu navegador no soporta audio HTML5.
        </audio>
    </div>

    <!-- Audio personalizado -->
    <div class="audio-box">
        <h3>Audio con controles avanzados</h3>

        <audio id="audio2" preload="metadata">
            <source src="sonido/audio1.mp3" type="audio/mpeg">
        </audio>

        <div class="controls">
            <button id="audioPlay">▶️</button>
            <label>Tono / Velocidad:
                <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
            </label>
            <label>Velocidad:
                <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
            </label>
            <a href="sonido/audio.mp3" download>
                <button>⬇️ Descargar</button>
            </a>
        </div>
    </div>
</div>


<!-- ===================== VIDEOS ===================== -->
<div class="media-container row">
    
    <!-- Video sin modificar -->
    <div class="col">
        <h2>🎥 Vídeo sin modificar</h2>
        <video controls width="100%">
            <source src="sonido/video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Video con controles personalizados -->
    <div class="col">
        <h2>🎬 Vídeo con controles personalizados</h2>

        <video id="video" preload="metadata">
            <source src="sonido/video1.mp4" type="video/mp4">
        </video>

        <div class="controls">
            <button id="play">▶️</button>
            <button id="mute">🔇</button>
            <button id="pip">🖼️ PiP</button>
            <button id="fullscreen">⛶</button>

            <div class="time">
                <span id="current">0:00</span> /
                <span id="duration">0:00</span>
            </div>

            <div class="progress" id="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <label>Volumen:
                <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
            </label>
        </div>
    </div>
</div>

<!-- ===================== IMÁGENES ===================== -->
<div class="media-container row">

    <div class="col">
        <h2>🖼️ Imagen sin modificar</h2>
        <img src="sonido/imagen.jpg" class="static-img">
    </div>

    <div class="col">
        <h2>🖌️ Imagen modificable</h2>

        <div class="img-wrapper">
            <img id="editable-img" src="sonido/imagen1.jpg">
        </div>

        <div class="controls">
            <button id="zoom">🔍 Zoom</button>
            <button id="opacity">🌫️ Opacidad</button>
            <button id="rotate">🔄 Rotar</button>
            <button id="reset">♻️ Reset</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
