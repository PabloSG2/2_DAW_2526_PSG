<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Multimedia en HTML5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Gestión Multimedia en HTML5</h1>
  <div class="media-container">
    <h2>🎵 Audio</h2>
    <audio controls preload="none">
      <source src="audio.mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <div class="media-container">
    <h2>🎬 Vídeo con controles personalizados</h2>
    <video id="video" preload="metadata">
      <source src="video.mp4" type="video/mp4">
      <track src="subtitulos.vtt" kind="subtitles" srclang="es" label="Español">
      Tu navegador no soporta vídeo.
    </video>
    <div class="controls">
      <button id="play">▶️ Play/Pause</button>
      <button id="pip">🖼️ Picture-in-Picture</button>
      <div class="progress" id="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="media-container">
    <h2>🖼️ Imágenes responsivas</h2>
    <picture>
      <source srcset="imagen.avif" type="image/avif">
      <source srcset="imagen.webp" type="image/webp">
      <img src="imagen.jpg" alt="Ejemplo de imagen responsiva">
    </picture>
  </div>
  <script src="script.js"></script>
</body>
</html>
